<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หมวดหมู่การใช้งาน | MEAT GUARD</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Kanit',sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;

    background:
    linear-gradient(
        rgba(0,0,0,.55),
        rgba(0,0,0,.55)
    ),
    url('https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1920&q=80');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
}

/* =========================
   ฝั่งซ้าย
========================= */

.left-side{
    width:60%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px;
}

.menu-box{
    width:100%;
    max-width:650px;
}

.menu-item{
    display:block;
    text-decoration:none;

    color:#b30000;

    font-size:24px;
    font-weight:600;

    margin:18px 0;
    padding:18px 25px;

    border-radius:22px;

    background:#ffffff;

    border:2px solid #ffd6d6;

    box-shadow:
    0 10px 25px rgba(0,0,0,.08),
    0 5px 15px rgba(255,0,0,.08);

    transition:.3s;
}

.menu-item:hover{
    transform:translateX(12px);

    background:#fff5f5;

    border-color:#ff9999;

    box-shadow:
    0 15px 35px rgba(255,0,0,.15);
}

/* =========================
   ฝั่งขวา
========================= */

.right-side{
    width:40%;
    position:relative;
}

/* หัวข้อ */

.category-title{
    position:absolute;
    top:40px;
    right:40px;

    background:rgba(255,210,210,.95);

    color:#b30000;

    padding:15px 35px;

    border-radius:30px;

    font-size:34px;
    font-weight:700;

    box-shadow:0 10px 25px rgba(255,0,0,.15);
}

/* ปุ่มย้อนกลับ */

.back-btn{
    position:absolute;
    bottom:40px;
    right:40px;

    width:70px;
    height:70px;

    border-radius:50%;

    text-decoration:none;

    background:#c40000;

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:34px;
    font-weight:bold;

    box-shadow:0 10px 25px rgba(196,0,0,.30);

    transition:.3s;
}

.back-btn:hover{
    transform:scale(1.1);
    background:#990000;
}

/* Responsive */

@media(max-width:1000px){

    body{
        flex-direction:column;
        overflow:auto;
    }

    .left-side,
    .right-side{
        width:100%;
    }

    .category-title{
        position:relative;
        top:auto;
        right:auto;
        margin:20px auto;
        width:max-content;
    }

    .back-btn{
        position:fixed;
        right:20px;
        bottom:20px;
    }

    .menu-item{
        font-size:20px;
    }
}

</style>
</head>
<body>

<!-- ฝั่งซ้าย -->

<div class="left-side">

    <div class="menu-box">

        </a>

        <a href="storage.html" class="menu-item">
            ❄️ ความรู้เรื่องการเก็บรักษาเนื้อสัตว์
        </a>

        <a href="innovation.html" class="menu-item">
            ⚙️ หลักการทำงานของนวัตกรรม
        </a>

        <a href="foodsafety.html" class="menu-item">
            🛡️ ประโยชน์และความปลอดภัยด้านอาหาร
        </a>

        <a href="didyouknow.html" class="menu-item">
            💡 Did You Know
        </a>

    </div>

</div>

<!-- ฝั่งขวา -->

<div class="right-side">

    <div class="category-title">
        หมวดหมู่การใช้งาน
    </div>

    <a href="index.html" class="back-btn">
        ←
    </a>

</div>

</body>
</html>
