<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c40000">
<title>สมัครสมาชิกด้วยอีเมล | MEAT GUARD</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">

<style>
body.reg{display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:linear-gradient(rgba(8,10,14,.6),rgba(8,10,14,.72)),
    url('https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1600&q=80');
  background-size:cover;background-position:center;background-attachment:fixed;}
@media(max-width:768px){body.reg{background-attachment:scroll;}}
.reg-wrap{width:100%;max-width:480px;}
.reg-card{padding:clamp(26px,5vw,40px);border-radius:var(--radius-lg);}
.logo{text-align:center;margin-bottom:18px;}
.logo .word{font-size:clamp(2rem,7vw,2.7rem);font-weight:800;letter-spacing:.04em;}
.logo .word .meat{color:var(--primary);}
.logo p{color:var(--muted);margin-top:4px;font-size:.82rem;letter-spacing:.12em;}
.title{text-align:center;margin-bottom:22px;}
.title h2{color:var(--primary-600);font-size:clamp(1.3rem,4vw,1.7rem);}
.title p{color:var(--muted);font-size:.92rem;margin-top:4px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:480px){.row2{grid-template-columns:1fr;gap:0;}}
.back-link{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:.9rem;}
.back-link:hover{color:var(--primary);}
</style>
</head>
<body class="reg" data-loader-text="กำลังเปิดหน้าสมัครสมาชิก…">

<a href="index.html" class="back-chip">← กลับ</a>

<div class="reg-wrap reveal" data-d="1">
  <div class="card glass reg-card">

    <div class="logo">
      <div class="word"><span class="meat">MEAT</span><span class="guard">GUARD</span></div>
      <p>SMART MEAT FRESHNESS DETECTION SYSTEM</p>
    </div>

    <div class="title">
      <h2>สมัครสมาชิกด้วยอีเมล</h2>
      <p>กรอกข้อมูลเพื่อเริ่มต้นใช้งานระบบ</p>
    </div>

    <form id="regForm" novalidate>
      <div class="field">
        <label for="name">ชื่อ - นามสกุล</label>
        <div class="control"><span class="ic">👤</span>
          <input class="input" id="name" type="text" placeholder="กรอกชื่อและนามสกุล" required></div>
        <span class="field-error"></span>
      </div>

      <div class="field">
        <label for="email">อีเมล</label>
        <div class="control"><span class="ic">📧</span>
          <input class="input" id="email" type="email" placeholder="example@email.com" required></div>
        <span class="field-error"></span>
      </div>

      <div class="field">
        <label for="phone">เบอร์โทรศัพท์</label>
        <div class="control"><span class="ic">📱</span>
          <input class="input" id="phone" type="tel" inputmode="numeric" placeholder="08xxxxxxxx" required></div>
        <span class="field-error"></span>
      </div>

      <div class="row2">
        <div class="field">
          <label for="pass">รหัสผ่าน</label>
          <div class="control"><span class="ic">🔒</span>
            <input class="input" id="pass" type="password" placeholder="อย่างน้อย 6 ตัว" required>
            <button type="button" class="toggle-pass" data-toggle-pass="pass">👁️</button></div>
          <span class="field-error"></span>
        </div>
        <div class="field">
          <label for="pass2">ยืนยันรหัสผ่าน</label>
          <div class="control"><span class="ic">🔒</span>
            <input class="input" id="pass2" type="password" placeholder="พิมพ์ซ้ำอีกครั้ง" required>
            <button type="button" class="toggle-pass" data-toggle-pass="pass2">👁️</button></div>
          <span class="field-error"></span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:6px;">ลงทะเบียน</button>
    </form>

    <a href="index.html" class="back-link">มีบัญชีอยู่แล้ว? <b>เข้าสู่ระบบ</b></a>
  </div>
</div>

<script src="assets/js/app.js"></script>
<script>
const MG = window.MeatGuard;
const $ = (id) => document.getElementById(id);

$("regForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = $("name"), email = $("email"), phone = $("phone"), p1 = $("pass"), p2 = $("pass2");
  let ok = true;

  if (name.value.trim().length < 2) { MG.setError(name, "กรุณากรอกชื่อ-นามสกุล"); ok = false; } else MG.setError(name, "");
  if (!MG.isEmail(email.value)) { MG.setError(email, "อีเมลไม่ถูกต้อง"); ok = false; } else MG.setError(email, "");
  if (!MG.isPhone(phone.value)) { MG.setError(phone, "เบอร์โทรไม่ถูกต้อง (ขึ้นต้น 0 และ 9-10 หลัก)"); ok = false; } else MG.setError(phone, "");
  if (p1.value.length < 6) { MG.setError(p1, "รหัสผ่านอย่างน้อย 6 ตัวอักษร"); ok = false; } else MG.setError(p1, "");
  if (p2.value !== p1.value || !p2.value) { MG.setError(p2, "รหัสผ่านไม่ตรงกัน"); ok = false; } else MG.setError(p2, "");

  if (!ok) { MG.toast("กรุณาตรวจสอบข้อมูลอีกครั้ง", "err"); return; }

  MG.Auth.set({ name: name.value.trim(), email: email.value.trim(), phone: phone.value.trim(), method: "email", at: Date.now() });
  MG.toast("ลงทะเบียนสำเร็จ", "ok");
  MG.go("category.html", "กำลังนำท่านเข้าสู่ระบบ…");
});
</script>
</body>
</html>
