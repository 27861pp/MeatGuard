<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิกด้วย LINE | MEAT GUARD</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Kanit',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#06C755,#04A943);
}

.card{
    width:90%;
    max-width:450px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
    text-align:center;
}

.logo{
    font-size:50px;
    margin-bottom:10px;
}

h1{
    color:#06C755;
    margin-bottom:10px;
}

p{
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#06C755;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#06C755;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    background:#04A943;
}

</style>
</head>
<body>

<div class="card">

    <div class="logo">💚</div>

    <h1>สมัครสมาชิกด้วย LINE</h1>

    <p>กรอกข้อมูลบัญชี LINE เพื่อเข้าใช้งานระบบ Meat Guard</p>

    <form action="category.html">

        <input
        type="text"
        placeholder="LINE ID"
        required>

        <input
        type="text"
        placeholder="ชื่อที่แสดงใน LINE"
        required>

        <button type="submit">
            สมัครสมาชิก
        </button>

    </form>

</div>

</body>
</html>
