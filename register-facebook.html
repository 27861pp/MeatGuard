<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิกด้วย Facebook | MEAT GUARD</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Kanit',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1877f2,#0d5bd7);
}

.card{
    width:90%;
    max-width:450px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
    text-align:center;
}

h1{
    color:#1877f2;
    margin-bottom:10px;
}

p{
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="card">

    <h1>Facebook Register</h1>

    <p>สมัครสมาชิกผ่าน Facebook</p>

    <form action="category.html">

        <input type="text"
               placeholder="ชื่อผู้ใช้ Facebook"
               required>

        <input type="email"
               placeholder="อีเมล Facebook"
               required>

        <button type="submit">
            สมัครสมาชิก
        </button>

    </form>

</div>

</body>
</html>
