<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meat Guard Monitor</title>


<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Kanit',sans-serif;
}



body{

background:#070b10;
color:white;
padding:25px;

}



.container{

max-width:1100px;
margin:auto;

}




.header{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;

}



.logo{

font-size:28px;
font-weight:700;

}


.online{

color:#2ee6a0;

}




.status{

background:#101923;

border:1px solid #243444;

border-radius:20px;

padding:40px;

display:flex;

align-items:center;

gap:50px;

margin-bottom:25px;

}




.loader{

width:180px;

height:180px;

border-radius:50%;

border:10px solid #1b3045;

border-top:10px solid #2196ff;

animation:spin 1.5s linear infinite;

display:flex;

align-items:center;

justify-content:center;

font-size:25px;

}



@keyframes spin{

100%{

transform:rotate(360deg);

}

}





.status h1{

font-size:50px;

}




.sub{

font-size:22px;

color:#aaa;

margin:15px 0;

}





.progress{

height:12px;

background:#222;

border-radius:10px;

overflow:hidden;

}



.progress span{

display:block;

height:100%;

background:#2196ff;

width:0%;

transition:.5s;

}




.time{

margin-top:15px;

font-size:18px;

color:#2196ff;

}





.grid{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:15px;

}




.card{

background:#101923;

border:1px solid #243444;

padding:25px;

border-radius:18px;

}




.card h3{

color:#8da0b5;

font-size:15px;

}



.value{

font-size:38px;

margin-top:15px;

}





.chart{

margin-top:25px;

background:#101923;

border:1px solid #243444;

padding:25px;

border-radius:18px;

}




@media(max-width:800px){

.status{

flex-direction:column;

}


.grid{

grid-template-columns:repeat(2,1fr);

}


}


.back-btn{

position:fixed;

top:25px;

left:25px;

background:#101923;

border:1px solid #243444;

color:white;

padding:10px 20px;

border-radius:12px;

font-size:16px;

cursor:pointer;

transition:.3s;

z-index:10;

}


.back-btn:hover{

background:#2196ff;

transform:translateX(-5px);

}


</style>


</head>


<body>



<div class="container">



<div class="header">


<div class="logo">

🥩 Meat Guard

</div>


<div class="online">

● ONLINE

</div>


</div>





<div class="status">



<div class="loader" id="loader">

⏳

</div>




<div>


<h1 id="status">

กำลังวิเคราะห์...

</h1>



<div class="sub" id="message">

ระบบกำลังตรวจสอบความสดของเนื้อ

</div>



<div class="progress">

<span id="bar"></span>

</div>



<div class="time" id="time">

กำลังวิเคราะห์ 0 / 5 นาที

</div>


</div>



</div>






<div class="grid">



<div class="card">

<h3>TEMPERATURE</h3>

<div class="value">

<span id="temp">--</span> °C

</div>

</div>





<div class="card">

<h3>HUMIDITY</h3>

<div class="value">

<span id="hum">--</span> %

</div>

</div>






<div class="card">

<h3>NH3</h3>

<div class="value">

<span id="nh3">--</span> ppm

</div>

</div>






<div class="card">

<h3>H2S</h3>

<div class="value">

<span id="h2s">--</span> ppm

</div>

</div>



</div>






<div class="chart">


<canvas id="chart"></canvas>


</div>






</div>







<script type="module">


import {initializeApp}

from

"https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";



import {

getDatabase,

ref,

onValue

}

from

"https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";






const firebaseConfig = {


apiKey:"AIzaSyA4sLKQy-mrmfcYNsptYo8fCt0H63gDGE4",

authDomain:"meat-83f83.firebaseapp.com",

databaseURL:"https://meat-83f83-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"meat-83f83",

storageBucket:"meat-83f83.firebasestorage.app",

messagingSenderId:"619234872715",

appId:"1:619234872715:web:a9f953a8cb5434ef97338e"

};






const app = initializeApp(firebaseConfig);


const db=getDatabase(app);






let chart=new Chart(

document.getElementById("chart"),{


type:"line",


data:{


labels:[],


datasets:[


{

label:"NH3",

data:[],

borderColor:"#2196ff"

},


{

label:"H2S",

data:[],

borderColor:"#ff4f91"

}


]

}

}

);










onValue(

ref(db,"meat/latest"),

snap=>{


let d=snap.val();


if(!d)return;



let startTime = localStorage.getItem("startTime");

if(!startTime){

startTime = Date.now();

localStorage.setItem(
"startTime",
startTime
);

}


let elapsed = Date.now() - startTime;


let minute = Math.floor(
elapsed / 60000
);


if(minute > 5){

minute = 5;

}





if(minute < 5){



document.getElementById("loader").style.display="flex";


document.getElementById("status").innerHTML=

"กำลังวิเคราะห์...";



document.getElementById("message").innerHTML=

"ระบบกำลังตรวจสอบความสดของเนื้อ";




document.getElementById("time").innerHTML=

"กำลังวิเคราะห์ "+minute+" / 5 นาที";



document.getElementById("bar").style.width=

(minute/5*100)+"%";



return;


}







// เสร็จแล้ว



document.getElementById("loader").style.animation="none";


document.getElementById("loader").innerHTML="✓";



document.getElementById("status").innerHTML=

d.status;




document.getElementById("message").innerHTML=

"วิเคราะห์เสร็จแล้ว";




document.getElementById("temp").innerHTML=d.temp;


document.getElementById("hum").innerHTML=d.humidity;


document.getElementById("nh3").innerHTML=d.nh3;


document.getElementById("h2s").innerHTML=d.h2s;



document.getElementById("bar").style.width="100%";



});










onValue(

ref(db,"meat/history"),

snap=>{


let data=snap.val();


if(!data)return;



let arr=Object.values(data);



chart.data.labels=

arr.map(x=>x.minute);



chart.data.datasets[0].data=

arr.map(x=>x.nh3);



chart.data.datasets[1].data=

arr.map(x=>x.h2s);



chart.update();


}

);



</script>



</body>

<button class="back-btn" onclick="history.back()">

← ย้อนกลับ

</button>
</html>
